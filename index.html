<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Key App</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-size: 2rem;
      transition: background-color 0.2s ease; /* 色の変化を滑らかにします */
    }
  </style>
</head>
<body>
  <div id="status">キーボードの [A] または [B] を押してください</div>

  <script>
    // TypeScriptとして記述する場合は (event: KeyboardEvent) => { ... } と型を定義します
    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const statusElement = document.getElementById('status');

      if (key === 'a') {
        document.body.style.backgroundColor = '#ff4d4d'; // 赤色
        document.body.style.color = '#ffffff';
        if (statusElement) statusElement.textContent = 'A が押されました（赤）';
      } else if (key === 'b') {
        document.body.style.backgroundColor = '#4d79ff'; // 青色
        document.body.style.color = '#ffffff';
        if (statusElement) statusElement.textContent = 'B が押されました（青）';
      }
    });
  </script>
</body>
</html>
